<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111111">
<title>Piano da zero</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Music&family=Schibsted+Grotesk:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --paper:#f3f3ef; --ink:#111; --mute:#55534d; --line:#d9d8d2;
    --lv:#ee4b2b; --on-lv:#111;
    --bad:#b0151f; --bad-bg:#ffd9d2;
    --ease:cubic-bezier(.16,1,.3,1);
    font-family:'Schibsted Grotesk',system-ui,sans-serif;
    color:var(--ink); background:var(--paper);
    -webkit-tap-highlight-color:transparent;
  }
  * { box-sizing:border-box; margin:0; }
  [hidden] { display:none !important; }
  ::selection { background:var(--lv); color:var(--on-lv); }
  html { scrollbar-color:var(--ink) var(--paper); }
  body { min-height:100dvh; font-size:18px; line-height:1.45; }
  button, .btn { font:inherit; font-weight:700; font-size:17px; min-height:48px; padding:0 20px; display:inline-flex; align-items:center; gap:10px;
    border:2px solid var(--ink); background:transparent; color:inherit; border-radius:0; cursor:pointer; touch-action:manipulation;
    transition:background .15s var(--ease), color .15s var(--ease); }
  button:hover, .btn:hover { background:var(--ink); color:var(--paper); }
  button.primary { background:var(--ink); color:var(--paper); }
  button.primary:hover { background:transparent; color:var(--ink); }
  button.icon { padding:0; width:48px; justify-content:center; }
  :focus-visible { outline:3px solid var(--ink); outline-offset:3px; }
  .on-colour :focus-visible { outline-color:var(--on-lv); }
  svg.i { width:22px; height:22px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:square; stroke-linejoin:miter; flex:none; }

  /* ===== Home ===== */
  .topbar { display:flex; align-items:center; gap:12px; flex-wrap:wrap; padding:18px clamp(20px,4vw,48px); border-bottom:2px solid var(--ink); }
  .wordmark { font-size:26px; font-weight:900; letter-spacing:-.03em; margin-right:auto; }
  .chip { display:inline-flex; align-items:center; gap:8px; font-weight:600; font-size:15px; color:var(--mute); }
  .switch { display:inline-flex; align-items:center; gap:10px; font-weight:700; font-size:16px; min-height:48px; cursor:pointer; }
  .switch input { appearance:none; width:44px; height:26px; border:2px solid var(--ink); position:relative; cursor:pointer; margin:0; }
  .switch input::after { content:''; position:absolute; top:3px; left:3px; width:16px; height:16px; background:var(--ink); transition:transform .2s var(--ease); }
  .switch input:checked { background:var(--ink); }
  .switch input:checked::after { background:var(--paper); transform:translateX(18px); }
  main { padding:clamp(20px,4vw,48px); max-width:1400px; margin:0 auto; }

  .next { all:unset; box-sizing:border-box; cursor:pointer; display:grid; grid-template-columns:1fr; align-content:end; gap:28px; width:100%;
    background:var(--lv); color:var(--on-lv); padding:clamp(24px,4vw,44px); min-height:260px; position:relative; overflow:hidden; }
  .next:focus-visible { outline:3px solid var(--ink); outline-offset:4px; }
  .next h1 { font-size:clamp(48px,7.5vw,96px); font-weight:900; line-height:.88; letter-spacing:-.04em; position:relative; }
  .next p { font-size:20px; font-weight:600; margin-top:14px; position:relative; }
  .next .go { position:relative; justify-self:start; display:inline-flex; align-items:center; gap:12px; font-size:22px; font-weight:800; border:2px solid currentColor; padding:14px 22px; }
  .next:hover .go { background:var(--on-lv); color:var(--lv); }
  .arcs { position:absolute; pointer-events:none; }
  .arcs circle { fill:none; stroke:currentColor; }

  .levels { display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:40px 28px; margin-top:56px; }
  .level h2 { font-size:22px; font-weight:800; letter-spacing:-.01em; margin:14px 0 2px; }
  .level > p { color:var(--mute); font-size:15px; margin-bottom:10px; }
  .poster { aspect-ratio:4/3; background:var(--c); color:var(--ci); position:relative; overflow:hidden; display:flex; align-items:flex-end; padding:10px 16px; }
  .poster b { font-size:150px; font-weight:900; line-height:.75; letter-spacing:-.04em; position:relative; }
  .poster .mark { width:44%; position:relative; fill:var(--ci); stroke:var(--ci); stroke-width:5; }
  .poster.locked b { opacity:.3; }
  .poster .lk { position:absolute; left:12px; top:12px; width:28px; height:28px; stroke:var(--ci); }
  .sr { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); }
  .me { all:unset; cursor:pointer; display:flex; align-items:center; gap:10px; font-weight:800; min-height:48px; padding-right:6px; }
  .me:focus-visible { outline:3px solid var(--ink); outline-offset:3px; }
  .me i { width:42px; height:42px; background:var(--pc); color:var(--pci); display:grid; place-items:center; font-style:normal; font-weight:900; font-size:22px; }
  .me small { display:block; font-weight:600; font-size:13px; color:var(--mute); }
  .stats { display:grid; grid-template-columns:auto 1fr 1fr; gap:32px; align-items:end; margin-bottom:28px; }
  .stat b { font-size:44px; font-weight:900; letter-spacing:-.03em; line-height:1; display:flex; align-items:center; gap:8px; }
  .stat b small { font-size:18px; font-weight:700; }
  .stat b svg.i { width:36px; height:36px; }
  .stat > span { display:block; font-size:14px; font-weight:700; color:var(--mute); margin-top:6px; }
  .meter { height:12px; border:2px solid var(--ink); margin-top:8px; } .meter i { display:block; height:100%; background:var(--ink); }
  .row2 { display:grid; grid-template-columns:1fr 1fr; gap:32px; margin-top:32px; align-items:start; }
  .drill { all:unset; box-sizing:border-box; cursor:pointer; background:var(--ink); color:var(--paper); padding:28px; min-height:240px; display:flex; flex-direction:column; justify-content:space-between; position:relative; overflow:hidden; width:100%; }
  .drill:focus-visible { outline:3px solid var(--ink); outline-offset:4px; }
  .drill h2 { font-size:clamp(36px,4.6vw,56px); font-weight:900; letter-spacing:-.04em; line-height:.9; position:relative; }
  .drill p { position:relative; font-size:18px; max-width:30ch; }
  .drill[aria-disabled="true"] { opacity:.5; cursor:not-allowed; }
  .board { border-top:3px solid var(--ink); }
  .board h2 { font-size:28px; font-weight:900; letter-spacing:-.02em; margin:12px 0 4px; }
  .board ol { list-style:none; padding:0; }
  .board li { display:grid; grid-template-columns:44px 1fr auto; align-items:center; gap:14px; min-height:64px; border-bottom:1px solid var(--line); }
  .board .pos { font-size:34px; font-weight:900; }
  .board .nm { font-weight:800; font-size:20px; } .board small { display:block; color:var(--mute); font-weight:600; font-size:14px; }
  .board .xp { font-size:24px; font-weight:900; }
  .board .pos, .board .xp, .stat b { font-variant-numeric:tabular-nums; }
  .board .tu { font-style:normal; font-size:13px; font-weight:800; background:var(--ink); color:var(--paper); padding:1px 6px; vertical-align:middle; }
  .hint { color:var(--mute); font-size:15px; margin-top:10px; }
  .seg { display:flex; } .seg button { flex:1; font-size:15px; } .seg button + button { border-left:0; }
  .seg button[aria-pressed="true"] { background:var(--ink); color:var(--paper); }
  .lib { grid-column:1/-1; display:grid; grid-template-columns:minmax(220px,300px) 1fr; gap:32px; align-items:start; }
  .libr { border-top:3px solid var(--ink); padding-top:14px; }
  .libr .import { flex-direction:row; flex-wrap:wrap; margin:0 0 8px; } .libr .seg { min-width:min(420px,100%); }
  .search { margin-bottom:18px; }
  .search label { display:block; font-size:22px; font-weight:900; letter-spacing:-.02em; margin-bottom:8px; }
  .srow { display:flex; gap:8px; }
  .srow input { flex:1; min-width:0; font:inherit; font-size:20px; min-height:56px; border:2px solid var(--ink); background:#fff; padding:0 14px; border-radius:0; }
  .search .msg { margin-top:8px; color:var(--mute); }
  .results { list-style:none; padding:0; max-height:420px; overflow:auto; }
  .results li { display:grid; grid-template-columns:1fr auto; gap:12px; align-items:center; min-height:58px; border-bottom:1px solid var(--line); }
  .results li span { font-weight:700; } .results small { display:block; color:var(--mute); font-weight:600; font-size:13px; }
  .results button { min-height:44px; font-size:15px; }
  .results .more { grid-template-columns:1fr; }
  .song { border-bottom:1px solid var(--line); padding:12px 0; }
  .song h3 { font-size:17px; font-weight:800; display:flex; justify-content:space-between; align-items:center; gap:8px; }
  .song h3 button { border:0; min-height:44px; width:44px; padding:0; justify-content:center; color:var(--mute); }
  .parts { display:flex; flex-wrap:wrap; gap:8px; margin-top:6px; }
  .parts button { min-height:44px; padding:0 12px; font-size:15px; border-width:2px; }
  .parts .stars svg { width:14px; height:14px; }
  .msg { font-size:15px; font-weight:600; }
  .lessons .goal { font-weight:800; }
  .lessons .goal span:first-child { display:inline-flex; align-items:center; gap:8px; }
  .who { position:fixed; inset:0; background:var(--paper); z-index:20; display:grid; place-items:center; padding:24px; overflow:auto; }
  .who h1 { font-size:clamp(56px,10vw,120px); font-weight:900; letter-spacing:-.04em; line-height:.9; margin-bottom:28px; }
  .players { display:flex; flex-wrap:wrap; gap:16px; }
  .player { all:unset; box-sizing:border-box; cursor:pointer; width:220px; aspect-ratio:1; background:var(--c); color:var(--ci); padding:16px; display:flex; flex-direction:column; justify-content:space-between; position:relative; overflow:hidden; }
  .player:focus-visible { outline:3px solid var(--ink); outline-offset:4px; }
  .player b { font-size:120px; font-weight:900; line-height:.8; position:relative; }
  .player span { font-weight:800; font-size:22px; position:relative; }
  .player small { font-weight:600; font-size:14px; }
  .newp { display:flex; flex-wrap:wrap; gap:10px; margin-top:28px; align-items:end; }
  .newp label { display:flex; flex-direction:column; gap:6px; font-weight:700; }
  .newp input { font:inherit; font-size:20px; min-height:52px; border:2px solid var(--ink); background:#fff; padding:0 14px; border-radius:0; width:min(320px,80vw); }
  .combo { font-size:18px; font-weight:900; min-height:22px; }
  .tip { text-align:center; color:var(--mute); font-size:17px; font-weight:600; }
  .xpf { position:absolute; left:50%; bottom:46%; font-weight:900; font-size:22px; background:var(--ink); color:var(--paper); padding:2px 8px; pointer-events:none; z-index:6; white-space:nowrap; animation:float .9s var(--ease) forwards; }
  @keyframes float { from { opacity:1; transform:translate(-50%,0); } to { opacity:0; transform:translate(-50%,-70px); } }
  #done .gain { display:flex; gap:36px; justify-content:center; margin-top:20px; }
  #done .gain b { display:block; font-size:48px; font-weight:900; line-height:1; font-variant-numeric:tabular-nums; }
  #done .gain span { font-weight:700; font-size:15px; }
  #done .lvup { margin:20px auto 0; font-size:24px; font-weight:900; border:3px solid var(--on-lv); display:inline-block; padding:10px 18px; }
  .lessons { list-style:none; padding:0; border-top:2px solid var(--ink); }
  .lessons button { width:100%; border:0; border-bottom:1px solid var(--line); justify-content:space-between; padding:0 2px; min-height:52px; font-weight:600; text-align:left; }
  .lessons button:hover:not(:disabled) { background:var(--c); color:var(--ci); }
  .lessons button:disabled { color:#9a978f; cursor:not-allowed; }
  .stars { display:inline-flex; gap:2px; }
  .stars svg { width:18px; height:18px; stroke:currentColor; stroke-width:2; fill:none; }
  .stars svg.f { fill:currentColor; }
  .import { display:flex; flex-direction:column; gap:12px; margin-top:12px; }
  .import select { font:inherit; min-height:48px; border:2px solid var(--ink); background:var(--paper); border-radius:0; padding:0 10px; width:100%; }
  .import label.check { display:flex; gap:10px; align-items:center; font-weight:600; }
  .import label.check input { width:22px; height:22px; accent-color:var(--ink); }

  /* ===== Lezione ===== */
  #player { height:100dvh; display:grid; grid-template-rows:auto 6px 1fr auto auto; overflow:hidden; }
  .band { min-height:min(24vh,210px); background:var(--lv); color:var(--on-lv); padding:clamp(14px,2.4vh,26px) clamp(20px,3vw,40px); display:grid; grid-template-columns:auto 1fr auto; gap:20px; align-items:start; position:relative; overflow:hidden; }
  .band h1 { font-size:clamp(30px,min(11vh,8vw),96px); overflow-wrap:anywhere; font-weight:900; line-height:.9; letter-spacing:-.04em; position:relative; text-wrap:balance; }
  .band .sub { font-weight:600; font-size:17px; margin-top:8px; position:relative; }
  .band > button { position:relative; }
  #band-arcs { position:absolute; inset:0; pointer-events:none; }
  .band .meta { text-align:right; position:relative; background:var(--lv); border:2px solid var(--on-lv); padding:12px 14px; display:flex; flex-direction:column; align-items:flex-end; gap:12px; }
  .band .count, .poster b { font-variant-numeric:tabular-nums; }
  .band .count { font-size:clamp(36px,6vh,64px); font-weight:900; line-height:.9; letter-spacing:-.03em; }
  .band .count small { font-size:.45em; font-weight:700; }
  .band .tools { display:flex; gap:8px; }
  .band button { border-color:var(--on-lv); }
  .band button:hover { background:var(--on-lv); color:var(--lv); }
  .band button.off { opacity:.45; }
  .bar { background:color-mix(in srgb,var(--lv) 28%,var(--paper)); } .bar i { display:block; height:100%; width:0; background:var(--ink); transition:width .35s var(--ease); }
  .stage { display:grid; grid-template-columns:1fr; align-items:center; padding:0 clamp(20px,3vw,40px); min-height:0; gap:28px; overflow:auto; }
  .stage.with-card { grid-template-columns:minmax(300px,0.9fr) 1.2fr; }
  .stage.card-only { grid-template-columns:minmax(0,880px); justify-content:center; }
  .card h2 { font-size:clamp(34px,6.4vh,64px); font-weight:900; line-height:.95; letter-spacing:-.03em; text-wrap:balance; }
  .card p { font-size:clamp(20px,3.1vh,27px); margin-top:16px; max-width:38ch; text-wrap:pretty; }
  .card .cont { margin-top:22px; }
  .staffwrap { display:flex; flex-direction:column; gap:6px; min-height:0; }
  #staff { width:100%; height:auto; max-height:31vh; }
  .sl { stroke:var(--ink); stroke-width:1.5; }
  .clef, .clefb, .acc { font-family:'Noto Music',serif; fill:var(--ink); } .clef { font-size:56px; } .clefb { font-size:56px; }
  .stem { stroke:var(--ink); stroke-width:1.9; } .stem.past, .sl.past { stroke:#bdbbb4; }
  .note { fill:var(--ink); } .note.past { fill:#bdbbb4; } .note.hit { fill:var(--lv); stroke:var(--ink); stroke-width:2; }
  .halo { fill:none; stroke:var(--lv); }
  .pulse { fill:none; stroke:var(--lv); stroke-width:3; transform-box:fill-box; transform-origin:center; animation:pulse 1.8s var(--ease) infinite; }
  @keyframes pulse { from { transform:scale(.7); opacity:.9; } to { transform:scale(1.9); opacity:0; } }
  .acc { font-size:46px; } .acc.past { fill:#bdbbb4; }
  .fnum { font-size:20px; font-weight:800; text-anchor:middle; fill:var(--ink); }
  .burst { fill:none; stroke:var(--lv); stroke-width:6; transform-box:fill-box; transform-origin:center; animation:burst .7s var(--ease) forwards; }
  .say { font-size:clamp(22px,3.6vh,34px); font-weight:800; letter-spacing:-.01em; text-align:center; }
  .say em { font-style:normal; background:var(--lv); color:var(--on-lv); padding:0 8px; }

  #mapbar { display:grid; grid-template-columns:auto 1fr; align-items:stretch; background:var(--ink); color:var(--paper); border-top:3px solid var(--ink); }
  #mapbar span { font-size:13px; font-weight:700; padding:0 12px; display:flex; align-items:center; white-space:nowrap; }
  #map { position:relative; height:clamp(28px,4.4vh,42px); overflow:hidden; background:#fff; }
  .mk { position:absolute; top:0; }
  .mk.w { height:100%; background:#fff; border-right:1px solid #999; } .mk.b { height:60%; background:var(--ink); z-index:1; }
  .mk.t { background:var(--lv) !important; }
  .mk.c4::after { content:''; position:absolute; bottom:3px; left:50%; width:4px; height:4px; margin-left:-2px; border-radius:50%; background:var(--ink); }
  .win { position:absolute; top:0; bottom:0; border:3px solid var(--lv); box-shadow:0 0 0 999px rgba(17,17,17,.55); z-index:2; pointer-events:none; }
  #kbd { position:relative; height:clamp(150px,27vh,280px); user-select:none; -webkit-user-select:none; touch-action:none; }
  .key { position:absolute; top:0; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; gap:8px; padding-bottom:12px; font-weight:700; font-size:clamp(14px,1.9vw,21px); }
  .key.white { height:100%; background:#fff; border-right:2px solid var(--ink); z-index:1; }
  .key.black { height:61%; background:var(--ink); color:var(--paper); z-index:2; }
  .key.mark.white { background:color-mix(in srgb,var(--lv) 30%,#fff); }
  .key.mark.black { box-shadow:inset 0 -40px 0 var(--lv); }
  .key.target { background:var(--lv) !important; color:var(--on-lv); }
  .key.on { background:var(--ink) !important; color:var(--paper); }
  .key.black.on { background:#555 !important; }
  .key.wrong { background:var(--bad-bg) !important; color:var(--bad); }
  .key.wrong::before, .key.wrong::after { content:''; position:absolute; top:28%; left:50%; width:4px; height:clamp(28px,5vh,46px); background:var(--bad); }
  .key.wrong::before { transform:translateX(-50%) rotate(45deg); } .key.wrong::after { transform:translateX(-50%) rotate(-45deg); }
  .key .c4 { width:8px; height:8px; background:currentColor; border-radius:50%; }
  .key .fg { width:clamp(30px,4vh,40px); height:clamp(30px,4vh,40px); border-radius:50%; background:var(--ink); color:var(--paper); display:grid; place-items:center; font-weight:900; font-size:clamp(16px,2.4vh,22px); }
  .ring { position:absolute; left:50%; bottom:22%; width:60px; height:60px; margin-left:-30px; border:5px solid var(--lv); border-radius:50%; pointer-events:none; z-index:5; animation:ring .65s var(--ease) forwards; }
  @keyframes ring { from { transform:scale(.4); opacity:1; } to { transform:scale(2.6); opacity:0; } }
  @keyframes burst { from { transform:scale(.6); opacity:1; } to { transform:scale(2.4); opacity:0; } }

  /* ===== Fine lezione ===== */
  #done { position:fixed; inset:0; background:var(--lv); color:var(--on-lv); display:grid; place-items:center; z-index:10; overflow:hidden; animation:rise .45s var(--ease); }
  #done .inner { position:relative; text-align:center; padding:24px; }
  #done h2 { font-size:clamp(80px,16vh,170px); font-weight:900; letter-spacing:-.04em; line-height:.85; }
  #done .big { display:flex; gap:14px; justify-content:center; margin:26px 0 10px; }
  #done .big svg { width:clamp(56px,10vh,96px); height:clamp(56px,10vh,96px); stroke:currentColor; stroke-width:2.5; fill:none; }
  #done .big svg.f { fill:currentColor; }
  #done p { font-size:22px; font-weight:600; }
  #done .acts { display:flex; gap:12px; justify-content:center; margin-top:28px; flex-wrap:wrap; }
  #done button { border-color:var(--on-lv); } #done button.primary { background:var(--on-lv); color:var(--lv); }
  #done button:hover { background:var(--on-lv); color:var(--lv); }
  @keyframes rise { from { clip-path:circle(0 at 50% 50%); } to { clip-path:circle(150% at 50% 50%); } }
  @media (prefers-reduced-motion:reduce) { .ring, .burst, .pulse, .xpf { display:none; } #done { animation:none; } * { transition:none !important; } }
  @media (max-width:760px) { .lib { grid-template-columns:1fr; } .stats, .row2 { grid-template-columns:1fr; } .next .arcs { display:none; } .stage { padding-block:16px; align-items:start; } .stage.with-card { grid-template-columns:1fr; } .band { grid-template-columns:auto 1fr; } .band .meta { grid-column:1/-1; flex-direction:row; justify-content:space-between; align-items:center; } }
</style>
</head>
<body>
<div id="home-view">
  <header class="topbar">
    <span class="wordmark">Piano da zero</span>
    <button class="me" id="me"></button>
    <span class="chip" id="status"></span>
    <button id="mic"></button>
    <label class="switch"><input type="checkbox" id="names"> Nomi delle note</label>
  </header>
  <main id="home"></main>
</div>

<section id="player" hidden aria-live="polite">
  <div class="band on-colour">
    <span id="band-arcs"></span>
    <button class="icon" id="back" aria-label="Torna ai livelli"></button>
    <div><h1 id="title"></h1><p class="sub" id="sub"></p></div>
    <div class="meta">
      <div class="count" id="count"></div>
      <div class="combo" id="combo" aria-live="polite"></div>
      <div class="tools">
        <button class="icon" id="base" aria-label="Base musicale"></button>
        <button class="icon" id="listen" aria-label="Ascolta la lezione"></button>
        <button class="icon" id="restart" aria-label="Ricomincia"></button>
      </div>
    </div>
  </div>
  <div class="bar"><i id="bar"></i></div>
  <div class="stage" id="stage">
    <div class="card" id="card"></div>

function token(t) {
  if (t === '*#') return { any:RANGE.filter(m => SHARP[m % 12]) };
  if (t[0] === '*') { const pc = (NOTE[t[1]] + (t[2] === '#')) % 12; return { any:RANGE.filter(m => m % 12 === pc) }; }
  return { need:t.split('+').map(note) };
}
const words = s => (s || '').trim().split(/\s+/).filter(Boolean);
function compile(x) {
  const steps = [], add = (str, f, extra) => { const fs = words(f); words(str).forEach((t, i) => {
    const s = { ...token(t), ...extra };
    s.finger = fs[i] || (x.pos && s.need?.length === 1 ? AUTO_F[x.pos][s.need[0]] : undefined);
    steps.push(s); }); };
  if (x.cards) x.cards.forEach((c, ci) => c.play ? add(c.play, c.f, { card:ci }) : steps.push({ card:ci, next:true }));
  else if (x.song) {
    const all = songSteps(x.song, songDiff), a = x.part < 0 ? 0 : x.part * PART, b = x.part < 0 ? all.length : a + PART;
    all.slice(a, b).forEach((g, i) => steps.push({ need:g.need, tick:g.tick, end:all[a + i + 1]?.tick ?? g.tick + x.song.div }));
  }
  else if (x.steps) x.steps.forEach(g => steps.push({ need:g }));
  else add(x.n, x.f, {});
  words(x.acc).forEach((a, i) => steps[i] && (steps[i].acc = a));
  return steps;
}

function streakOf(p) {
  const set = new Set(p.days), d = new Date(); let n = 0;

async function search(q, page) {

// ===== Parser MIDI minimo: note-on per traccia e canale, tempo, divisione =====

// ===== Lezione =====

  else cur = allLessons()[i];

function buildKeys() {
  const used = cur.st.flatMap(s => s.need || []);

  let lo = used.length ? Math.min(...used) : 48, hi = used.length ? Math.max(...used) : 72;
  lo -= lo % 12; hi += (12 - hi % 12) % 12;
  if (hi - lo < span) hi = lo + span;
  const kbd = $('#kbd'), whites = [];
  for (let m = lo; m <= hi; m++) if (!SHARP[m % 12]) whites.push(m);
  const w = 100 / whites.length;
  kbd.innerHTML = '';
  for (let m = lo; m <= hi; m++) {
    const k = document.createElement('div'), wi = whites.filter(x => x < m).length;
    k.dataset.m = m;
    if (SHARP[m % 12]) { k.className = 'key black'; k.style.left = (wi * w - w * 0.31) + '%'; k.style.width = w * 0.62 + '%'; }
    else { k.className = 'key white'; k.style.left = wi * w + '%'; k.style.width = w + '%'; }

    : `<i class="mk w${m === 60 ? ' c4' : ''}" data-m="${m}" style="left:${wl(m)}%;width:${u}%"></i>`;
  mh += `<b class="win" style="left:${wl(Math.max(lo, MLO))}%;width:${wl(Math.min(hi, MHI) + 1) - wl(Math.max(lo, MLO))}%"></b>`;

function render() {
  const s = cur.st[step] || {}, card = cur.cards?.[s.card], names = showNames && !card?.hideNames;
  // tastiera

  const marks = new Set(card?.mark ? token(card.mark).any : []);

    k.classList.toggle('wrong', wrongKeys.has(m));
    const fg = targets.has(m) && ti >= 0 && fingers[ti] ? `<span class="fg">${esc(fingers[ti])}</span>` : '';

    k.innerHTML = fg + (m === 60 ? '<span class="c4" aria-hidden="true"></span>' : '') + `<span>${label}</span>`;
  });

  const total = cur.st.length, practice = cur.st.filter(x => !x.next).length, done = cur.st.slice(0, step).filter(x => !x.next).length;
  $('#count').innerHTML = practice ? `${done}<small>/${practice}</small>` : '';
  $('#combo').textContent = combo >= 3 ? `Combo ${combo}${multOf(combo) > 1 ? ` · punti ×${multOf(combo)}` : ''}` : '';
  $('#bar').style.width = 100 * step / total + '%';
  // scena: scheda di teoria e/o pentagramma
  const showStaff = !card || card.staff;
  $('#stage').className = 'stage ' + (card ? (showStaff ? 'with-card' : 'card-only') : '');
  $('#card').hidden = !card;
  if (card) {
    $('#card').innerHTML = `<h2>${esc(card.h)}</h2><p>${esc(card.p)}</p>${s.next ? `<button class="primary cont" id="cont">Avanti ${icon('arrow')}</button><p style="font-size:16px;color:var(--mute)">oppure premi un tasto qualsiasi</p>` : ''}`;
    if (s.next) $('#cont').onclick = () => advance();

}
function sayText(s, names) {
  if (s.next) return '';
  if (s.any) { const pcs = new Set(s.any.map(m => m % 12)); return `Suona ${pcs.size === 1 ? `un <em>${NAMES[s.any[0] % 12]}</em>` : 'un <em>tasto nero</em>'} qualsiasi`; }
  if (!s.need) return '';
  const left = s.need.filter(m => !hit.has(m));
  const nm = left.map(m => names ? NAMES[m % 12] : '?').join(' ');
  const f = s.need.length === 1 && s.finger ? ` — dito ${s.finger}, ${FINGER[s.finger]}` : '';
  if (s.need.length > 1) return `Suona insieme <em>${nm}</em>${micOn ? ' (col microfono, una alla volta)' : ''}`;
  return names ? `Suona il <em>${nm}</em>${f}` : `Quale nota è?${f}`;
}
const ledger = (x, y, w, cls = '') => `<line x1="${x - w}" x2="${x + w}" y1="${y}" y2="${y}" class="sl ${cls}"/>`;
const SP = 14;                                   // spazio tra le linee del pentagramma
const dia = m => (Math.floor(m / 12) - 1) * 7 + PC_DIA[m % 12];
const posY = m => m >= 60 ? 120 - (dia(m) - 30) * 7 : 190 - (dia(m) - 26) * 7;
// note vere: testa ovale inclinata, gambo, tagli addizionali; le alte (da Do4) in chiave di violino, le basse in chiave di basso
function drawStaff(names) {
  const many = cur.cards ? 5 : 8, W = 200 + many * 100;
  $('#staff').setAttribute('viewBox', `0 0 ${W} 300`);
  let h = '';
  for (let i = 0; i < 5; i++) for (const y0 of [64, 190]) h += `<line x1="20" x2="${W - 10}" y1="${y0 + i * SP}" y2="${y0 + i * SP}" class="sl"/>`;
  h += `<line x1="20" x2="20" y1="64" y2="246" class="sl" style="stroke-width:2.5"/>`;
  h += `<text x="30" y="113" class="clef">𝄞</text><text x="32" y="234" class="clefb">𝄢</text>`;
  const from = Math.max(0, step - 1), RX = 8.6, RY = 6.3;
  cur.st.slice(from, from + many).forEach((s, k) => {
    if (!s.need) return;
    const idxS = from + k, x = 200 + k * 100, rel = idxS - step, past = rel < 0 ? 'past' : '';
    for (const tr of [true, false]) {
      const g = s.need.filter(m => (m >= 60) === tr); if (!g.length) continue;
      const ys = g.map(posY), lo = Math.max(...ys), hiY = Math.min(...ys);
      const up = ys.reduce((a, b) => a + b, 0) / ys.length > (tr ? 92 : 218);   // sotto la linea centrale: gambo in su
      const sx = up ? x + RX - 0.8 : x - RX + 0.8, y2 = up ? hiY - 3.5 * SP : lo + 3.5 * SP;
      for (const m of g) {
        const d = dia(m), y = posY(m), Y = l => tr ? 120 - (l - 30) * 7 : 190 - (l - 26) * 7;
        if (tr) { for (let l = 28; l >= d; l -= 2) h += ledger(x, Y(l), RX + 6, past); for (let l = 40; l <= d; l += 2) h += ledger(x, Y(l), RX + 6, past); }
        else { for (let l = 28; l <= d; l += 2) h += ledger(x, Y(l), RX + 6, past); for (let l = 16; l >= d; l -= 2) h += ledger(x, Y(l), RX + 6, past); }
        if (rel === 0 && !hit.has(m)) h += `<circle cx="${x}" cy="${y}" r="20" class="halo" stroke-width="3"/><circle cx="${x}" cy="${y}" r="30" class="halo" stroke-width="1.5"/><circle cx="${x}" cy="${y}" r="20" class="pulse"/>`;
        if (SHARP[m % 12]) h += `<text x="${x - RX - 22}" y="${y + 10}" class="acc ${past}">♯</text>`;
        h += `<ellipse cx="${x}" cy="${y}" rx="${RX}" ry="${RY}" transform="rotate(-20 ${x} ${y})" class="note ${past} ${rel === 0 && hit.has(m) ? 'hit' : ''}"/>`;
        if (idxS === burst) h += `<circle cx="${x}" cy="${y}" r="14" class="burst"/>`;
      }
      h += `<line x1="${sx}" x2="${sx}" y1="${up ? lo : hiY}" y2="${y2}" class="stem ${past}"/>`;
      // diteggiatura: sopra il violino, sotto il basso, come sugli spartiti
      if (rel === 0 && s.finger) {
        const fy = tr ? Math.min(hiY, y2) - 14 : Math.max(lo, y2) + 26;
        const fs = String(s.finger).split('-').filter((_, i) => (s.need[i] >= 60) === tr).join(' ');
        if (fs) h += `<text x="${x}" y="${fy}" class="fnum">${esc(fs)}</text>`;
      }
    }
  });
  burst = -1;
  $('#staff').innerHTML = h;
}
function ring(m) {
  const k = $(`.key[data-m="${m}"]`); if (!k) return;
  const r = document.createElement('span'); r.className = 'ring';
  k.append(r); r.addEventListener('animationend', () => r.remove());
}
function floatXp(m, txt) {
  const k = $(`.key[data-m="${m}"]`); if (!k) return;
  const f = document.createElement('span'); f.className = 'xpf'; f.textContent = txt;
  k.append(f); f.addEventListener('animationend', () => f.remove());
}
function advance(m) {
  const s = cur.st[step];
  if (!s.next) {
    combo++; bestCombo = Math.max(bestCombo, combo);
    const g = multOf(combo); lessonXp += g;   // 1 XP a nota, ×2 da 8 di combo, ×3 da 20
    if (m !== undefined) floatXp(m, multOf(combo) > 1 ? `+${g} ×${multOf(combo)}` : `+${g}`);
    backing(s, step);
  }
  burst = step; step++; hit.clear(); wrongKeys.clear();
  if (step >= cur.st.length) return finish();
  render();
}
// Metodo "aspetta la nota giusta"
function handle(m) {
  if (!cur || $('#player').hidden || !$('#done').hidden || step >= cur.st.length) return;
  const s = cur.st[step];
  if (s.next) return advance();
  const octaveOk = n => micOn && n % 12 === m % 12;   // ponytail: col microfono accetto errori d'ottava (armoniche)
  if (s.any) {
    if (s.any.includes(m) || s.any.some(octaveOk)) { ring(m); return advance(m); }
  } else {
    let t = s.need.includes(m) ? m : s.need.find(n => octaveOk(n) && !hit.has(n));
    if (t !== undefined) {
      ring(t); hit.add(t);
      if (s.need.every(n => hit.has(n))) return advance(t);
      return render();
    }
  }
  errors++; combo = 0; wrongKeys.add(m); render();   // il tasto sbagliato resta segnato finché non suoni quello giusto
}
function finish() {
  const n = cur.st.length, st = errors <= 1 ? 3 : errors <= Math.max(3, n * 0.15) ? 2 : 1;
  const first = cur.id !== 'drill' && !(P.prog[cur.id] > 0);
  const total = lessonXp + st * 5 + (first ? 20 : 0), before = lvOf(P.xp);
  if (cur.id !== 'drill') P.prog[cur.id] = Math.max(P.prog[cur.id] || 0, st);
  P.best = Math.max(P.best || 0, bestCombo);
  addXp(total);
  const after = lvOf(P.xp), list = allLessons(), hasNext = cur.id === 'drill' || idx + 1 < list.length;
  const d = $('#done');
  d.innerHTML = `${arcs(1400, 4, 1.6, 'left:50%;top:50%;transform:translate(-50%,-50%)', 33)}<div class="inner">
    <h2 id="done-h">${st === 3 ? 'Perfetto.' : 'Fatto.'}</h2><div class="big" aria-label="${st} stelle su 3">${stars(st)}</div>
    <div class="gain"><div><b>+${total}</b><span>XP${first ? ' (+20 prima volta)' : ''}</span></div><div><b>${bestCombo}</b><span>combo migliore</span></div><div><b>${errors}</b><span>${errors === 1 ? 'errore' : 'errori'}</span></div><div><b>${streakOf(P)}</b><span>giorni di fila</span></div></div>
    ${after > before ? `<p class="lvup">Livello ${after} raggiunto · ${titleOf(after)}</p>` : ''}
    <div class="acts">${hasNext ? `<button class="primary" id="next">${cur.id === 'drill' ? 'Ancora' : 'Prossima lezione'} ${icon('arrow')}</button>` : ''}
      <button id="again">${icon('restart')} Riprova</button><button id="home-btn">Home</button></div></div>`;
  d.hidden = false;
  $('#again').onclick = () => start(idx);
  if (hasNext) { $('#next').onclick = () => start(cur.id === 'drill' ? 'drill' : idx + 1); $('#next').focus(); } else $('#home-btn').focus();
  $('#home-btn').onclick = goHome;
}
function goHome() { history.replaceState(null, '', location.pathname); cur = null; $('#player').hidden = true; $('#done').hidden = true; $('#home-view').hidden = false; renderHome(); }
$('#back').innerHTML = icon('back'); $('#listen').innerHTML = icon('play'); $('#restart').innerHTML = icon('restart');
$('#back').onclick = goHome;
const baseLabel = () => { $('#base').innerHTML = icon('drum'); $('#base').setAttribute('aria-pressed', baseOn); $('#base').title = baseOn ? 'Base accesa' : 'Base spenta'; $('#base').classList.toggle('off', !baseOn); };
$('#base').onclick = () => { baseOn = !baseOn; store.set('base', baseOn); baseLabel(); };
$('#restart').onclick = () => start(idx);
$('#listen').onclick = () => cur.st.forEach((s, i) => (s.need || []).forEach(m => beep(m, 0.45, i * 0.5)));
addEventListener('keydown', e => { if (e.key === 'Escape' && cur) goHome(); });
addEventListener('resize', () => { if (cur && !$('#player').hidden) { buildKeys(); render(); } });

// ===== Audio + input =====
let ac;
const audio = () => ac || (ac = new (window.AudioContext || window.webkitAudioContext)());
const heard = new Array(12).fill(0);   // note suonate dall'app: il microfono le ignora
function beep(m, dur = 0.5, when = 0, vol = 0.3) {
  const a = audio(), t = a.currentTime + when, o = a.createOscillator(), g = a.createGain();
  o.type = 'triangle'; o.frequency.value = 440 * 2 ** ((m - 69) / 12);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(a.destination); o.start(t); o.stop(t + dur);
  heard[m % 12] = Math.max(heard[m % 12], performance.now() + (when + dur) * 1000 + 150);
}
let noiseBuf;
function drum(m, when = 0) {
  const a = audio(), t = a.currentTime + when, g = a.createGain();
  g.connect(a.destination);
  if (m === 35 || m === 36) {   // cassa
    const o = a.createOscillator(); o.frequency.setValueAtTime(150, t); o.frequency.exponentialRampToValueAtTime(45, t + 0.12);
    g.gain.setValueAtTime(0.6, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.25); o.connect(g); o.start(t); o.stop(t + 0.25); return;
  }
  if (!noiseBuf) { noiseBuf = a.createBuffer(1, a.sampleRate * 0.3, a.sampleRate); const ch = noiseBuf.getChannelData(0); for (let i = 0; i < ch.length; i++) ch[i] = Math.random() * 2 - 1; }
  const n = a.createBufferSource(), f = a.createBiquadFilter(), snare = m === 38 || m === 40, len = snare ? 0.14 : 0.05;
  n.buffer = noiseBuf; f.type = snare ? 'bandpass' : 'highpass'; f.frequency.value = snare ? 1800 : 7000;
  g.gain.setValueAtTime(snare ? 0.35 : 0.12, t); g.gain.exponentialRampToValueAtTime(0.001, t + len);
  n.connect(f).connect(g); n.start(t); n.stop(t + len);
}
const CH = { C:[48,52,55], G:[47,50,55], Am:[45,48,52], F:[45,48,53], Dm:[50,53,57], Em:[47,52,55] };
const ROOT = { C:36, G:43, Am:45, F:41, Dm:38, Em:40 };
// la base segue chi suona: parte quando completi il passo, poi aspetta il prossimo
function backing(s, i) {
  if (!baseOn) return;
  if (cur.song) {
    const so = cur.song, spt = so.tempo / 1e6 / so.div, span = (s.end - s.tick) * spt;
    for (const [tk, m, dr] of so.acc) {
      if (tk < s.tick) continue; if (tk >= s.end) break;
      const w = (tk - s.tick) * spt; if (w > 4) break;
      if (dr) drum(m, w);
      else if (!micOn || m < 48) beep(m, Math.min(1.2, Math.max(0.25, span - w)), w, micOn ? 0.1 : 0.07);   // col microfono solo il basso
    }
    return;
  }
  if (!cur.acc) return;
  const beat = 60 / (cur.bpm || 90), b = i % 4, accs = cur.st.map(x => x.acc);
  drum(b % 2 ? 38 : 36); drum(42, beat / 2); drum(42);
  if (s.acc && s.acc !== '.') {
    let len = 1; while (accs[i + len] === '.') len++;
    beep(ROOT[s.acc], micOn ? 0.5 : len * beat, 0, 0.22);
    if (!micOn) CH[s.acc].forEach(m => beep(m + 12, len * beat, 0.02, 0.06));
  }
}
function noteOn(m, src) {
  if (src === 'mic' && heard[m % 12] > performance.now()) return;   // è la base, non la pianola
  if (src === 'screen' || src === 'pc') beep(m);   // la pianola suona già da sola
  const k = $(`.key[data-m="${m}"]`);
  if (k) { k.classList.add('on'); setTimeout(() => k.classList.remove('on'), 160); }
  handle(m);
}

// tastiera del computer: A W S E D F T G Y H U J K (Z/X = ottava)
const KEYS = 'awsedftgyhujkolp;'; let oct = 0;
addEventListener('keydown', e => {
  if (e.repeat || e.metaKey || e.ctrlKey || /INPUT|SELECT/.test(e.target.tagName)) return;
  if (e.key === 'z') oct -= 12; else if (e.key === 'x') oct += 12;
  else { const i = KEYS.indexOf(e.key.toLowerCase()); if (i >= 0) noteOn(60 + i + oct, 'pc'); }
});

// MIDI (pianola via USB, Chrome)
const status = (ic, s) => $('#status').innerHTML = s ? icon(ic) + esc(s) : '';
if (navigator.requestMIDIAccess) navigator.requestMIDIAccess().then(acc => {
  const bind = () => {
    let n = 0;
    acc.inputs.forEach(i => { n++; i.onmidimessage = e => { const [s, d, v] = e.data; if ((s & 0xf0) === 0x90 && v > 0) noteOn(d, 'midi'); }; });
    status('midi', n ? 'Pianola collegata via USB' : '');
  };
  bind(); acc.onstatechange = bind;
}, () => status('midi', '')); else status('midi', '');

// microfono: autocorrelazione, una nota alla volta
function detect(b, sr) {
  let rms = 0; for (const x of b) rms += x * x; rms = Math.sqrt(rms / b.length);
  if (rms < 0.01) return [null, rms];
  const n = b.length / 2, c = new Float32Array(n);
  for (let lag = 0; lag < n; lag++) { let s = 0; for (let i = 0; i < n; i++) s += b[i] * b[i + lag]; c[lag] = s; }
  let l = 1; while (l < n - 1 && c[l] > c[l + 1]) l++;
  let max = 0; for (let i = l; i < n; i++) max = Math.max(max, c[i]);
  if (max < 0.5 * c[0]) return [null, rms];
  let p = l; while (p < n - 1 && !(c[p] >= 0.9 * max && c[p] >= c[p + 1])) p++;
  const a = c[p - 1], bb = c[p], cc = c[p + 1], shift = (a - cc) / (2 * (a - 2 * bb + cc)) || 0;
  return [sr / (p + shift), rms];
}
const micLabel = () => $('#mic').innerHTML = icon('mic') + (micOn ? 'Microfono attivo' : 'Usa il microfono');
micLabel();
$('#mic').onclick = async () => {
  if (micOn) return;
  if (!navigator.mediaDevices?.getUserMedia) { alert('Il microfono funziona solo da un indirizzo https:// o da localhost.'); return; }
  try {
    const s = await navigator.mediaDevices.getUserMedia({ audio:{ echoCancellation:true, noiseSuppression:false, autoGainControl:false } });
    const a = audio(); await a.resume();
    const an = a.createAnalyser(); an.fftSize = 2048;
